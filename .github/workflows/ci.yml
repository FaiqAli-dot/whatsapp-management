name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint / typecheck
        run: npm run typecheck && npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
      - name: Security tests
        run: npm run test:security
        env:
          NODE_ENV: test
      - name: Build
        run: npm run build
      - name: Dependency audit (high+)
        run: npm run audit:deps || true
        # Triage in docs/SECURITY.md — do not blind-upgrade
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/client
      - name: Playwright E2E
        run: npm run test:e2e
        working-directory: apps/client
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report
      - name: Upload load-test placeholder note
        run: echo "Load tests run manually against isolated env — see docs/TESTING.md"
